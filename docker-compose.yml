services:
  db:
    image: postgres:16-alpine
    container_name: movie-db
    environment:
      POSTGRES_DB: moviedb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d moviedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/moviedb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Massive Performance Boost Settings
      JAVA_OPTS_APPEND: >-
        -Xms512m
        -Xmx1024m
        -XX:MetaspaceSize=96M
        -XX:MaxMetaspaceSize=256m
        -Djava.net.preferIPv4Stack=true
        -Dquarkus.http.io-threads=10
        -Dquarkus.http.max-connections=100
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8081"
    depends_on:
      - db

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: movie-cache
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512mb

volumes:
  postgres_data:
  elastic_data:
